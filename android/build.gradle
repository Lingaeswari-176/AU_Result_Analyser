plugins {
    id 'com.android.application'
}

android {
    // FIX: This namespace declaration is required for Gradle 8+ builds
    namespace 'com.au.resultanalyzer'
    compileSdk 34

    defaultConfig {
        applicationId "com.au.resultanalyzer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Keeps dependencies entirely clean and native to match your MainActivity
    implementation 'com.google.android.material:material:1.9.0'
}
