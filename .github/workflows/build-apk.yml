name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Force Global Gradle Installation
        uses: gradle/actions/setup-gradle@v4
        with:
          # Forces GitHub to use an official engine, bypassing missing gradlew scripts
          gradle-version: '8.2'

      - name: Compile Mobile Package
        run: |
          cd android
          # Runs compilation using the secure global engine configuration
          gradle clean assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AU-Result-Analyser-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
