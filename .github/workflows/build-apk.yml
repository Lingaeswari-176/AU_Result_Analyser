name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # FIXES THE ERROR ON THE SERVER INSTANTLY:
      - name: Overwrite and Fix Gradle Scripts
        run: |
          cd android
          
          # 1. Rewriting root build.gradle with correct plugins syntax
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. Rewriting app/build.gradle with correct application container setup
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.au.resultanalyzer'
              compileSdk 34
              defaultConfig {
                  applicationId "com.au.resultanalyzer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # 3. Create basic settings.gradle if missing
          if [ ! -f "settings.gradle" ]; then
            echo "include ':app'" > settings.gradle
          fi

      - name: Setup Gradle Compiler
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Application Build
        run: |
          cd android
          gradle clean assembleDebug --stacktrace

      - name: Upload Functional Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AU-Result-Analyser-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
