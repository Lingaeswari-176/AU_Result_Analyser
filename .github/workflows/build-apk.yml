name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # THIS WIPS AND REWRITES THE ENTIRE ENVIRONMENT PERFECTLY ON THE SERVER
      - name: Force Clean Build Setup
        run: |
          rm -rf android/build.gradle android/app/build.gradle android/settings.gradle
          mkdir -p android/app/src/main
          
          # 1. Create a pristine root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. Create a pristine app module build.gradle
          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'
          
          android {
              namespace 'com.au.resultanalyzer'
              compileSdk 34
              
              defaultConfig {
                  applicationId "com.au.resultanalyzer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          # 3. Create a pristine settings.gradle
          echo "include ':app'" > android/settings.gradle

      - name: Setup Gradle Compiler
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Execute Automated Android Compilation
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload Functional Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AU-Result-Analyser-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
