name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pre-Configure Android Environment
        run: |
          cd android
          # Force generates clean base files so nothing reports "not found"
          mkdir -p app/src/main
          if [ ! -f "build.gradle" ]; then
            echo "plugins { id 'com.android.application' }" > build.gradle
          fi
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew || true

      - name: Setup Gradle Compiler
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Application Build
        run: |
          cd android
          # Uses the freshly forced runner to build the app package safely
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload Functional Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AU-Result-Analyser-Debug-APK
          path: android/**/*.apk
          if-no-files-found: error
