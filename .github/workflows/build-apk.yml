name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Uses a pre-built compiler container that bypasses your local gradle files completely
      - name: Build Android Package via Docker Container
        uses: serso/github-action-android-build@v1
        with:
          project-root: 'android'
          build-command: 'gradle assembleDebug'

      - name: Upload Functional Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AU-Result-Analyser-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
